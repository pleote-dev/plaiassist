<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#4169E1" stroke="#2C3E50" stroke-width="4"/>
  
  <!-- Avatar head -->
  <circle cx="128" cy="90" r="35" fill="#FDBCB4" stroke="#E8A598" stroke-width="2"/>
  
  <!-- Avatar hair -->
  <path d="M93 75 Q93 55 128 55 Q163 55 163 75 Q163 85 158 90 L98 90 Q93 85 93 75Z" fill="#8B4513" stroke="#654321" stroke-width="2"/>
  
  <!-- Avatar eyes -->
  <circle cx="115" cy="85" r="4" fill="#4169E1"/>
  <circle cx="141" cy="85" r="4" fill="#4169E1"/>
  
  <!-- Avatar smile -->
  <path d="M115 100 Q128 110 141 100" stroke="#E8A598" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Avatar body -->
  <rect x="108" y="120" width="40" height="60" rx="20" fill="#FDBCB4" stroke="#E8A598" stroke-width="2"/>
  
  <!-- Avatar dress -->
  <path d="M100 140 L100 200 Q128 210 156 200 L156 140 Q128 145 100 140Z" fill="#FF69B4" stroke="#FF1493" stroke-width="2"/>
  
  <!-- Avatar arms -->
  <rect x="85" y="130" width="15" height="40" rx="7" fill="#FDBCB4" stroke="#E8A598" stroke-width="2"/>
  <rect x="156" y="130" width="15" height="40" rx="7" fill="#FDBCB4" stroke="#E8A598" stroke-width="2"/>
  
  <!-- Magic wand/sparkle effect -->
  <g transform="translate(180, 60)">
    <!-- Wand -->
    <rect x="0" y="0" width="3" height="25" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    <circle cx="1.5" cy="0" r="3" fill="#FFD700"/>
    
    <!-- Sparkles -->
    <path d="M-5 -5 L-3 -3 L-5 -1 L-7 -3 Z" fill="#FFD700" opacity="0.8"/>
    <path d="M8 -3 L10 -1 L8 1 L6 -1 Z" fill="#FFD700" opacity="0.8"/>
    <path d="M-3 5 L-1 7 L1 5 L-1 3 Z" fill="#FFD700" opacity="0.8"/>
    <path d="M10 5 L12 7 L14 5 L12 3 Z" fill="#FFD700" opacity="0.8"/>
  </g>
  
  <!-- MCP indicator -->
  <rect x="20" y="220" width="60" height="20" rx="10" fill="#2C3E50"/>
  <text x="50" y="234" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">MCP</text>
  
  <!-- Status indicator -->
  <circle cx="220" cy="230" r="8" fill="#00FF00" stroke="#00AA00" stroke-width="2">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
