<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes Visual Avatar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background: transparent;
    }

    body.mode-companion .status,
    body.mode-companion .hud-controls,
    body.mode-web .status,
    body.mode-web .hud-controls {
      display: none !important;
    }

    body.mode-companion #canvas-container,
    body.mode-web #canvas-container {
      cursor: grab;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    .status {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(13, 13, 16, 0.78);
      border: 1px solid rgba(245, 223, 160, 0.35);
      color: #f5dfa0;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.2px;
      backdrop-filter: blur(6px);
      z-index: 1000;
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }

    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #888;
      transition: background 0.25s ease;
    }

    #status-dot.connected {
      background: #4ade80;
      box-shadow: 0 0 6px #4ade80;
    }

    #speech-bubble {
      --tail-x: 50%;
      position: absolute;
      top: 40px;
      left: 50%;
      max-width: min(260px, 86vw);
      min-width: 60px;
      background: linear-gradient(160deg, rgba(20, 18, 24, 0.94), rgba(8, 8, 11, 0.94));
      border: 1px solid rgba(233, 196, 106, 0.75);
      color: #fff6e0;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 12.5px;
      line-height: 1.4;
      text-align: left;
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      transform-origin: var(--tail-x) 100%;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 1001;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 0 14px rgba(233, 196, 106, 0.18),
        inset 0 0 0 1px rgba(255, 230, 160, 0.06);
    }

    #speech-bubble::before {
      content: '';
      position: absolute;
      top: 0;
      left: 12px;
      right: 12px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 220, 140, 0.9), transparent);
    }

    #speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: calc(var(--tail-x) - 7px);
      width: 12px;
      height: 12px;
      background: rgba(10, 10, 13, 0.96);
      border-right: 1px solid rgba(233, 196, 106, 0.75);
      border-bottom: 1px solid rgba(233, 196, 106, 0.75);
      transform: rotate(45deg);
    }

    #speech-bubble.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .hud-controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 1000;
    }

    body:hover .hud-controls {
      opacity: 1;
    }

    .btn-group {
      display: flex;
      gap: 4px;
    }

    .control-btn {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(245, 223, 160, 0.4);
      border-radius: 50%;
      background: rgba(13, 13, 16, 0.82);
      color: #f5dfa0;
      cursor: pointer;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .control-btn:hover {
      background: rgba(245, 223, 160, 0.2);
      transform: scale(1.08);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="status">
    <span id="status-dot"></span>
    <span id="status-text">Standby</span>
  </div>

  <div id="speech-bubble"><span id="speech-text"></span></div>

  <div class="hud-controls">
    <div class="btn-group">
      <button class="control-btn" data-pose="waving" data-emotion="happy" title="Wave">👋</button>
      <button class="control-btn" data-pose="thinking" data-emotion="thinking" title="Think">🤔</button>
      <button class="control-btn" data-pose="explaining" data-emotion="confident" title="Explain">💬</button>
      <button class="control-btn" data-pose="idle" data-emotion="neutral" title="Idle">✨</button>
    </div>
    <div class="btn-group">
      <button class="control-btn" id="btn-config" title="Settings">⚙️</button>
      <button class="control-btn" id="btn-hide" title="Hide">👁️</button>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
